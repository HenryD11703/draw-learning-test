[package]
name = "trazo_academia"
version = "0.2.0"
edition = "2024"
description = "Aprende a dibujar en digital: ejercicios con nota, estudios con referencia y autocrítica, y un recorrido de 48 lecciones, con los pinceles y el suavizado de Krita."
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryD11703/draw-learning-test"
readme = "../README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
