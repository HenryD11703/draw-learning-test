[package]
name = "trazo_academia"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
